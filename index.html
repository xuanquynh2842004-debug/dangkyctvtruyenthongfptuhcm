<script>
document.addEventListener("DOMContentLoaded", function () {

  // ============================================================
  // URL WEB APP GOOGLE APPS SCRIPT
  // Sau này bạn chỉ cần dán URL /exec vào đây
  // ============================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFiIj-0nwQ52cOAxu3xc3Ae54ZjfkmPTut-w4pvf_JVoZkuxeuD49ATWyPbN3DiRJWOA/exec";


  // ============================================================
  // LẤY CÁC ELEMENT
  // ============================================================
  const form = document.getElementById("applyForm");
  const successBox = document.getElementById("successBox");
  const formErr = document.getElementById("formErr");
  const submitBtn = document.getElementById("submitBtn");

  const teamRadios = document.querySelectorAll('input[name="team"]');
  const teamOpts = document.querySelectorAll(".team-opt");

  const sections = {
    social: document.getElementById("sec-social"),
    production: document.getElementById("sec-production"),
    copywriter: document.getElementById("sec-copywriter")
  };


  // ============================================================
  // KIỂM TRA ELEMENT
  // ============================================================
  if (!form) {
    console.error("Không tìm thấy #applyForm");
    return;
  }

  if (!submitBtn) {
    console.error("Không tìm thấy #submitBtn");
    return;
  }


  // ============================================================
  // CHỌN TEAM
  // ============================================================
  teamRadios.forEach(function (radio) {

    radio.addEventListener("change", function () {

      // Xóa active của tất cả team
      teamOpts.forEach(function (option) {
        option.classList.remove("active");
      });

      // Ẩn tất cả section
      Object.values(sections).forEach(function (section) {
        if (section) {
          section.style.display = "none";
        }
      });

      // Team đang chọn
      const selectedTeam = radio.closest(".team-opt");

      if (!selectedTeam) return;

      selectedTeam.classList.add("active");

      const teamKey = selectedTeam.getAttribute("data-team");

      if (sections[teamKey]) {
        sections[teamKey].style.display = "block";
      }
    });

  });


  // ============================================================
  // CHIP CHECKBOX
  // ============================================================
  document.querySelectorAll(".chip").forEach(function (chip) {

    chip.addEventListener("click", function (event) {

      // Nếu click trực tiếp vào checkbox thì không toggle 2 lần
      if (event.target.tagName.toLowerCase() === "input") {
        return;
      }

      const input = chip.querySelector("input");

      if (!input) return;

      input.checked = !input.checked;

      chip.classList.toggle("checked", input.checked);
    });

  });


  // ============================================================
  // LẤY GIÁ TRỊ CHIP
  // ============================================================
  function getChipValues(containerId) {

    const container = document.getElementById(containerId);

    if (!container) return [];

    return Array.from(
      container.querySelectorAll("input:checked")
    ).map(function (input) {
      return input.value;
    });

  }


  // ============================================================
  // GỬI DỮ LIỆU SANG GOOGLE APPS SCRIPT
  // ============================================================
  async function submitToGoogleSheet(data) {

    if (
      !APPS_SCRIPT_URL ||
      APPS_SCRIPT_URL === "DÁN_URL_APPS_SCRIPT_VÀO_ĐÂY"
    ) {
      throw new Error("Chưa nhập URL Google Apps Script");
    }

    const response = await fetch(APPS_SCRIPT_URL, {
      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Google Apps Script trả về lỗi");
    }

    return await response.text();
  }


  // ============================================================
  // SUBMIT FORM
  // ============================================================
  form.addEventListener("submit", async function (e) {

    e.preventDefault();

    formErr.style.display = "none";


    // ----------------------------------------------------------
    // KIỂM TRA TEAM
    // ----------------------------------------------------------
    const team = document.querySelector(
      'input[name="team"]:checked'
    );

    if (!form.checkValidity() || !team) {

      formErr.textContent =
        "Bạn ơi, còn thiếu vài câu bắt buộc (*) ở trên nè!";

      formErr.style.display = "block";

      form.reportValidity();

      return;
    }


    // ----------------------------------------------------------
    // XÁC ĐỊNH TEAM
    // ----------------------------------------------------------
    const teamValue = team.value;

    let teamKey;

    if (teamValue === "Social Team") {
      teamKey = "social";
    }
    else if (teamValue === "Production Team") {
      teamKey = "production";
    }
    else {
      teamKey = "copywriter";
    }


    // ----------------------------------------------------------
    // KIỂM TRA CÂU HỎI RIÊNG CỦA TEAM
    // ----------------------------------------------------------
    const requiredMap = {

      social: [
        "s1",
        "s2",
        "s4"
      ],

      production: [
        "p3"
      ],

      copywriter: [
        "c1",
        "c2",
        "c4"
      ]

    };


    let missing = false;


    requiredMap[teamKey].forEach(function (id) {

      const element = document.getElementById(id);

      if (!element || !element.value.trim()) {
        missing = true;
      }

    });


    // Social
    if (
      teamKey === "social" &&
      getChipValues("s3chips").length === 0
    ) {
      missing = true;
    }


    // Production
    if (teamKey === "production") {

      if (getChipValues("p1chips").length === 0) {
        missing = true;
      }

      if (getChipValues("p4chips").length === 0) {
        missing = true;
      }

      if (!document.querySelector('input[name="p2"]:checked')) {
        missing = true;
      }

    }


    // Copywriter
    if (
      teamKey === "copywriter" &&
      getChipValues("c3chips").length === 0
    ) {
      missing = true;
    }


    // Thời gian
    if (getChipValues("timechips").length === 0) {
      missing = true;
    }


    if (missing) {

      formErr.textContent =
        "Bạn ơi, còn thiếu vài câu bắt buộc (*) ở trên nè!";

      formErr.style.display = "block";

      return;
    }


    // ==========================================================
    // GỘP CÂU TRẢ LỜI TEAM
    // ==========================================================
    let detailsText = "";


    // SOCIAL
    if (teamKey === "social") {

      detailsText =
        "[Content đỉnh & vì sao]\n" +
        document.getElementById("s1").value +
        "\n\n" +

        "[Content khiến bạn ước gì nghĩ ra trước]\n" +
        document.getElementById("s2").value +
        "\n\n" +

        "[Điểm mạnh]\n" +
        getChipValues("s3chips").join(", ") +
        "\n\n" +

        "[Xử lý sự kiện nhàm chán]\n" +
        document.getElementById("s4").value;

    }


    // PRODUCTION
    else if (teamKey === "production") {

      const p2 = document.querySelector(
        'input[name="p2"]:checked'
      );

      detailsText =
        "[Kinh nghiệm]\n" +
        getChipValues("p1chips").join(", ") +
        "\n\n" +

        "[Mức độ thoải mái trước máy quay, 1-5]\n" +
        (p2 ? p2.value : "") +
        "\n\n" +

        "[Xử lý sự cố bất ngờ]\n" +
        document.getElementById("p3").value +
        "\n\n" +

        "[Vai trò muốn thử]\n" +
        getChipValues("p4chips").join(", ");

    }


    // COPYWRITER
    else {

      detailsText =
        "[Headline PR]\n" +
        document.getElementById("c1").value +
        "\n\n" +

        "[Đoạn kể chuyện]\n" +
        document.getElementById("c2").value +
        "\n\n" +

        "[Dạng bài tự tin nhất]\n" +
        getChipValues("c3chips").join(", ") +
        "\n\n" +

        "[Bài viết ưng ý]\n" +
        document.getElementById("c4").value;

    }


    // ==========================================================
    // TẠO OBJECT DỮ LIỆU
    // ==========================================================
    const entry = {

      fullname:
        document.getElementById("fullname").value.trim(),

      msv:
        document.getElementById("msv").value.trim(),

      khoa:
        document.getElementById("khoa").value.trim(),

      nganh:
        document.getElementById("nganh").value.trim(),

      phone:
        document.getElementById("phone").value.trim(),

      email:
        document.getElementById("email").value.trim(),

      social:
        document.getElementById("social").value.trim(),

      portfolio:
        document.getElementById("portfolio").value.trim(),

      team:
        teamValue,

      details:
        detailsText,

      why:
        document.getElementById("why").value.trim(),

      time:
        getChipValues("timechips").join(", "),

      finalpitch:
        document.getElementById("finalpitch").value.trim(),

      submittedAt:
        new Date().toISOString()

    };


    // ==========================================================
    // ĐỔI TRẠNG THÁI BUTTON
    // ==========================================================
    submitBtn.disabled = true;

    submitBtn.textContent = "ĐANG GỬI...";


    // ==========================================================
    // GỬI GOOGLE SHEET
    // ==========================================================
    try {

      await submitToGoogleSheet(entry);


      // --------------------------------------------------------
      // HIỆN SUCCESS
      // --------------------------------------------------------
      form.style.display = "none";

      successBox.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


    }
    catch (error) {

      console.error(error);

      submitBtn.disabled = false;

      submitBtn.textContent = "GỬI ĐĂNG KÝ";

      formErr.textContent =
        "Có lỗi khi gửi dữ liệu. Bạn thử lại giúp mình nhé!";

      formErr.style.display = "block";

    }

  });

});
</script>
