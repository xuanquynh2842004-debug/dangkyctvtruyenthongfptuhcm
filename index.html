<script>
/* ============================================================
   GOOGLE SHEETS / GOOGLE APPS SCRIPT
   Website → Google Apps Script → Google Sheets

   SAU KHI DEPLOY APPS SCRIPT:
   Dán URL có dạng:
   https://script.google.com/macros/s/XXXXXXXX/exec

   vào GOOGLE_SCRIPT_URL bên dưới.
   ============================================================ */

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFiIj-0nwQ52cOAxu3xc3Ae54ZjfkmPTut-w4pvf_JVoZkuxeuD49ATWyPbN3DiRJWOA/exec";
// Ví dụ:
// const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/XXXXXXXXXXXX/exec";


/* ============================================================
   HIỂN THỊ TEAM ĐƯỢC CHỌN
   ============================================================ */

const teamRadios = document.querySelectorAll('input[name="team"]');

const teamOpts = document.querySelectorAll('.team-opt');

const sections = {
  social: document.getElementById('sec-social'),
  production: document.getElementById('sec-production'),
  copywriter: document.getElementById('sec-copywriter')
};

teamRadios.forEach(radio => {

  radio.addEventListener('change', () => {

    // Xóa trạng thái active cũ
    teamOpts.forEach(option => {
      option.classList.remove('active');
    });

    // Ẩn tất cả section
    Object.values(sections).forEach(section => {
      section.style.display = 'none';
    });

    // Tìm team đang được chọn
    const selectedOption = radio.closest('.team-opt');

    if (selectedOption) {

      selectedOption.classList.add('active');

      const teamKey = selectedOption.getAttribute('data-team');

      if (sections[teamKey]) {
        sections[teamKey].style.display = 'block';
      }
    }
  });

});


/* ============================================================
   CHIP SELECTOR
   ============================================================ */

document.querySelectorAll('.chip').forEach(chip => {

  chip.addEventListener('click', () => {

    const input = chip.querySelector('input');

    if (!input) return;

    input.checked = !input.checked;

    chip.classList.toggle('checked', input.checked);

  });

});


/* ============================================================
   LẤY GIÁ TRỊ CÁC CHIP ĐƯỢC CHỌN
   ============================================================ */

function getChipValues(containerId) {

  return Array.from(
    document.querySelectorAll('#' + containerId + ' input:checked')
  ).map(input => input.value);

}


/* ============================================================
   GỬI DỮ LIỆU ĐẾN GOOGLE APPS SCRIPT
   ============================================================ */

async function submitToGoogleSheet(data) {

  if (!GOOGLE_SCRIPT_URL) {
    throw new Error(
      'Chưa cấu hình GOOGLE_SCRIPT_URL. Hãy dán URL Google Apps Script.'
    );
  }

  const response = await fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',

    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },

    body: JSON.stringify(data)
  });

  if (!response.ok) {
    throw new Error('Không thể kết nối Google Apps Script.');
  }

  return true;
}


/* ============================================================
   FORM
   ============================================================ */

const form = document.getElementById('applyForm');

const successBox = document.getElementById('successBox');

const formErr = document.getElementById('formErr');

const submitBtn = document.getElementById('submitBtn');


/* ============================================================
   SUBMIT FORM
   ============================================================ */

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  formErr.style.display = 'none';


  /* ----------------------------------------------------------
     KIỂM TRA THÔNG TIN CƠ BẢN
     ---------------------------------------------------------- */

  const team = document.querySelector(
    'input[name="team"]:checked'
  );

  if (!form.checkValidity() || !team) {

    formErr.style.display = 'block';

    form.reportValidity();

    return;
  }


  /* ----------------------------------------------------------
     XÁC ĐỊNH TEAM
     ---------------------------------------------------------- */

  const teamValue = team.value;

  let teamKey;

  if (teamValue === 'Social Team') {

    teamKey = 'social';

  } else if (teamValue === 'Production Team') {

    teamKey = 'production';

  } else {

    teamKey = 'copywriter';

  }


  /* ----------------------------------------------------------
     KIỂM TRA CÂU HỎI BẮT BUỘC THEO TEAM
     ---------------------------------------------------------- */

  const requiredMap = {

    social: [
      's1',
      's2',
      's4'
    ],

    production: [
      'p3'
    ],

    copywriter: [
      'c1',
      'c2',
      'c4'
    ]

  };


  let missing = false;


  requiredMap[teamKey].forEach(id => {

    const element = document.getElementById(id);

    if (!element || !element.value.trim()) {

      missing = true;

    }

  });


  /* Social */

  if (
    teamKey === 'social' &&
    getChipValues('s3chips').length === 0
  ) {

    missing = true;

  }


  /* Production */

  if (teamKey === 'production') {

    if (
      getChipValues('p1chips').length === 0 ||
      getChipValues('p4chips').length === 0 ||
      !document.querySelector('input[name="p2"]:checked')
    ) {

      missing = true;

    }

  }


  /* Copywriter */

  if (
    teamKey === 'copywriter' &&
    getChipValues('c3chips').length === 0
  ) {

    missing = true;

  }


  /* Thời gian */

  if (
    getChipValues('timechips').length === 0
  ) {

    missing = true;

  }


  if (missing) {

    formErr.textContent =
      'Bạn ơi, còn thiếu vài câu bắt buộc (*) ở trên nè!';

    formErr.style.display = 'block';

    return;

  }


  /* ==========================================================
     GỘP CÂU TRẢ LỜI THEO TEAM
     ========================================================== */

  let detailsText = '';


  /* ---------------- SOCIAL ---------------- */

  if (teamKey === 'social') {

    detailsText =

      `[Content đỉnh & vì sao]\n` +
      `${document.getElementById('s1').value}\n\n` +

      `[Content khiến bạn ước gì nghĩ ra trước]\n` +
      `${document.getElementById('s2').value}\n\n` +

      `[Điểm mạnh]\n` +
      `${getChipValues('s3chips').join(', ')}\n\n` +

      `[Xử lý sự kiện nhàm chán]\n` +
      `${document.getElementById('s4').value}`;

  }


  /* ---------------- PRODUCTION ---------------- */

  else if (teamKey === 'production') {

    const cameraLevel =
      document.querySelector(
        'input[name="p2"]:checked'
      )?.value || '';


    detailsText =

      `[Kinh nghiệm]\n` +
      `${getChipValues('p1chips').join(', ')}\n\n` +

      `[Mức độ thoải mái trước máy quay, 1-5]\n` +
      `${cameraLevel}\n\n` +

      `[Xử lý sự cố bất ngờ]\n` +
      `${document.getElementById('p3').value}\n\n` +

      `[Vai trò muốn thử]\n` +
      `${getChipValues('p4chips').join(', ')}`;

  }


  /* ---------------- COPYWRITER ---------------- */

  else {

    detailsText =

      `[Headline PR]\n` +
      `${document.getElementById('c1').value}\n\n` +

      `[Đoạn kể chuyện]\n` +
      `${document.getElementById('c2').value}\n\n` +

      `[Dạng bài tự tin nhất]\n` +
      `${getChipValues('c3chips').join(', ')}\n\n` +

      `[Bài viết ưng ý]\n` +
      `${document.getElementById('c4').value}`;

  }


  /* ==========================================================
     TẠO DỮ LIỆU GỬI GOOGLE SHEETS
     ========================================================== */

  const entry = {

    fullname:
      document.getElementById('fullname').value.trim(),

    msv:
      document.getElementById('msv').value.trim(),

    khoa:
      document.getElementById('khoa').value.trim(),

    nganh:
      document.getElementById('nganh').value.trim(),

    phone:
      document.getElementById('phone').value.trim(),

    email:
      document.getElementById('email').value.trim(),

    social:
      document.getElementById('social').value.trim(),

    portfolio:
      document.getElementById('portfolio').value.trim(),

    team:
      teamValue,

    details:
      detailsText,

    why:
      document.getElementById('why').value.trim(),

    time:
      getChipValues('timechips').join(', '),

    finalpitch:
      document.getElementById('finalpitch').value.trim()

  };


  /* ==========================================================
     TRẠNG THÁI ĐANG GỬI
     ========================================================== */

  submitBtn.disabled = true;

  submitBtn.textContent = 'ĐANG GỬI...';


  try {

    /* --------------------------------------------------------
       GỬI TRỰC TIẾP ĐẾN GOOGLE APPS SCRIPT
       -------------------------------------------------------- */

    await submitToGoogleSheet(entry);


    /* --------------------------------------------------------
       HIỂN THỊ THÀNH CÔNG
       -------------------------------------------------------- */

    form.style.display = 'none';

    successBox.style.display = 'block';

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });


  } catch (error) {

    console.error(
      'Lỗi gửi Google Sheets:',
      error
    );


    submitBtn.disabled = false;

    submitBtn.textContent = 'GỬI ĐĂNG KÝ';


    formErr.textContent =
      'Có lỗi khi gửi đăng ký. Bạn thử lại giúp mình nhé!';


    formErr.style.display = 'block';

  }

});
</script>
